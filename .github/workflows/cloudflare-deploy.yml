name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
    inputs:
      seed_latest:
        description: Import and verify the latest official result
        type: boolean
        default: false
      enable_cron:
        description: Enable scheduled draw sync after D1 has been seeded or restored
        type: boolean
        default: false
permissions:
  contents: read
concurrency: thai-lotto-cloudflare-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LOTTO_D1_ID: ${{ vars.LOTTO_D1_ID }}
      ENABLE_CRON: ${{ inputs.enable_cron }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$LOTTO_D1_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and LOTTO_D1_ID before deploying."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: |
          node scripts/configure-cloudflare.mjs
          if [ "$ENABLE_CRON" != "true" ]; then
            node --input-type=module -e 'import fs from "node:fs"; const path="dist/server/wrangler.production.json"; const config=JSON.parse(fs.readFileSync(path,"utf8")); config.triggers={crons:[]}; fs.writeFileSync(path,JSON.stringify(config,null,2)+"\n")'
          fi
      - run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.production.json
      - name: Deploy and optionally verify the latest draw
        env:
          SEED_LATEST: ${{ inputs.seed_latest }}
        run: |
          set -euo pipefail
          config=dist/server/wrangler.production.json
          npx wrangler deploy --config "$config" | tee "$RUNNER_TEMP/lotto-deploy.log"
          if [ "$SEED_LATEST" != "true" ]; then exit 0; fi
          origin=$(sed -nE 's|^[[:space:]]*(https://thai-lotto-insight\.[a-z0-9-]+\.workers\.dev)[[:space:]]*$|\1|p' "$RUNNER_TEMP/lotto-deploy.log" | head -n 1)
          test -n "$origin"
          secrets=$(npx wrangler secret list --format json --config "$config")
          if jq -e 'any(.[]; .name == "SYNC_TOKEN")' >/dev/null <<< "$secrets"; then
            echo "::error::An admin sync secret already exists."
            exit 1
          fi
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          printf '%s\n' "$secret" | npx wrangler secret put SYNC_TOKEN --config "$config"
          cleanup() {
            curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/thai-lotto-insight/secrets/SYNC_TOKEN" | jq -e '.success' >/dev/null
          }
          trap cleanup EXIT
          result=$(curl --silent --show-error --connect-timeout 10 --max-time 90 --retry 5 --retry-delay 5 --retry-all-errors --fail-with-body -X POST -H "Authorization: Bearer $secret" "$origin/api/admin/draw-sync")
          draw=$(jq -er 'select(.status == "imported" or .status == "updated" or .status == "duplicate") | .drawDate' <<< "$result")
          curl --fail --silent --show-error "$origin/api/results/$draw" | jq -e --arg date "$draw" '.. | objects | select(.drawDate? == $date)' >/dev/null
          echo "Verified draw $draw at $origin/api/results/$draw"

