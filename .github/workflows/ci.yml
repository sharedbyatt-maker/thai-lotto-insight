name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Typecheck failure"
              echo '```text'
              tail -n 80 typecheck-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
