name: Android preview
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: HTTPS origin of the results API
        required: true
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-preview.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_ORIGIN: ${{ inputs.api_origin || 'https://thai-lotto-insight.happylearnkids2025.chatgpt.site' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo prebuild --platform android --no-install
      - working-directory: mobile/android
        run: |
          printf '\nreact { debuggableVariants = [] }\n' >> app/build.gradle
          ./gradlew :app:assembleDebug --no-daemon
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/index.android.bundle'
      - uses: actions/upload-artifact@v4
        with:
          name: ThaiLotto-Android-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
